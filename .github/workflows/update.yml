name: Mettre à jour les alertes TAC

on:
  schedule:
    - cron: '0 * * * *' # Exécution automatique toutes les heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lancer le script de récupération
        run: node scripts/update-alerts.js

      - name: Sauvegarder automatiquement sur GitHub
        run: |
          git config --global user.name "Robot Info Trafic"
          git config --global user.email "robot@users.noreply.github.com"
          git add alertes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour horaire des alertes trafic" && git push)