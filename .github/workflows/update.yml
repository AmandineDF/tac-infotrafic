name: Update GTFS Alerts

on:
  schedule:
    - cron: '*/30 * * * *' # S'exécute toutes les 30 minutes
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions de GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests gtfs-realtime-bindings

      - name: Run update script
        run: python scripts/update_alerts.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add alertes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des alertes transport [skip ci]" && git push)